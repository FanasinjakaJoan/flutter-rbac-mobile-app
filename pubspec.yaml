name: rbac_mobile_app
description: Application Flutter de démonstration pour l'authentification multi-identifiant et le RBAC.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
